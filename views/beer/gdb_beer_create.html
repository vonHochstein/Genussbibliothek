<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../gdb_style.css">
  <link rel="stylesheet" href="../../gdb_components.css">
  <link rel="stylesheet" href="gdb_beer_detail.css">

  <link rel="stylesheet" href="../../gdb_stars.css">
  <link rel="stylesheet" href="../../gdb_stockbar.css">
  <link rel="stylesheet" href="../../gdb_pli.css">
  <link rel="stylesheet" href="../../gdb_stockbottle.css">

  <title>Bier – Neuer Eintrag</title>
</head>
<body>
  <div class="detail-view"></div>
    <div id="masterDataViewMode" data-edit-mode="on">
    <div class="detail-wrap card">
      <div class="detail-section-head">
      </div>
      <div class="detail-grid">

        <div class="detail-image">
          <div class="detail-image-wrap" id="beerImageWrap">
            <img id="beerImage" class="detail-image" alt="" loading="lazy" decoding="async">
          </div>
          <div id="imageEditFields" class="detail-image-edit">
            <label class="detail-image-edit-label" for="editImageUpload"><strong>Bild ändern:</strong></label>
            <input type="file" id="editImageUpload" accept="image/*" class="detail-edit-field detail-edit-input" hidden style="display:none;">
            <div class="detail-image-filepicker" style="display:flex; flex-direction:column">
              <label for="editImageUpload" id="btnPickImage" class="detail-edit-btn detail-edit-btn-secondary">Datei auswählen</label>
              <div id="editImageFileName" class="detail-edit-hint muted">Keine Datei ausgewählt</div>
            </div>
            <div class="detail-image-edit-actions">
              <button type="button" id="btnDeleteImage" class="detail-edit-btn detail-edit-btn-secondary">Bild löschen</button>
            </div>
            <div id="imageEditHint" class="detail-edit-hint" hidden></div>
          </div>
          <div class="detail-image-badges">
            <div id="beerCollectorBadge" class="collector-badge" style="display:none;" title="Sammlerstück / Sonderedition">
              <img src="../../img/collectors_badge.png" alt="Sammlerstück / Sonderedition" class="collector-img">
            </div>
          </div>
          <div id="beerProvisionalBadge" class="provisional-strip" hidden>Vorläufiger Eintrag</div>
        </div>

        <div class="detail-main">
          <div class="detail-lines">
            <div class="detail-card-title" id="beerName" style="display:none;">Neues Bier</div>
            <div class="detail-subtitle" style="display:none;">
              <span id="beerBrewery">Brauerei</span>
              <span id="beerDot"> • </span>
              <span id="beerStyle">Bierstil</span>
            </div>
            <div class="detail-meta-line muted" id="beerOriginLine" style="display:none;">
              <img id="countryFlagImg" class="wiki-flag" alt="">
              <img id="regionFlagImg" class="wiki-flag" alt="">
              <span id="countryText">Land</span>
              <span class="sep">-</span>
              <span id="regionText">Region</span>
            </div>
            <div class="detail-meta-line" id="beerStatsLine" style="display:none;">
              <span id="beerVolume"></span>
              <span class="sep" id="sepVolAbv">|</span>
              <span id="beerAbv"></span>
            </div>
            <div class="detail-meta-line" id="beerFermentationLine" style="display:none;">
              <span class="meta-label">Gärungsart:</span>
              <span id="beerFermentationType"></span>
            </div>
            <div class="detail-meta-line" id="beerPackageLine" style="display:none;">
              <span class="meta-label">Gebinde:</span>
              <span id="beerPackageType"></span>
            </div>
            <div class="detail-meta-line" id="beerPriceLine" style="display:none;">
              <span id="beerPrice"></span>
            </div>
            <div class="detail-meta-line" id="beerEditionBatchLine" style="display:none;">
              <span class="meta-label">Edition/Jahrgang/Batch:</span>
              <span id="beerEditionBatch"></span>
            </div>

            <div id="masterDataEditFields">
              <p style="margin-top: 6px;">
                <strong>Biername:*</strong><br>
                <input type="text" id="editBierName" class="detail-edit-field detail-edit-input" autofocus>
              </p>
              <p style="margin-top: 6px;">
                <strong>Brauerei:</strong><br>
                <input type="text" id="editBrewery" class="detail-edit-field detail-edit-input">
              </p>
              <p style="margin-top: 6px;">
                <strong>Bierstil:</strong><br>
                <input type="text" id="editStyle" list="beerStyleOptions" class="detail-edit-field detail-edit-input">
                <datalist id="beerStyleOptions">
                  <option value="Pils / Pilsner"><option value="Helles"><option value="Dunkel">
                  <option value="Lager"><option value="Märzen / Festbier"><option value="Kellerbier / Zwickel">
                  <option value="Bock"><option value="Doppelbock"><option value="Eisbock">
                  <option value="Weizen / Hefeweizen"><option value="Witbier"><option value="Kölsch"><option value="Altbier">
                  <option value="Pale Ale"><option value="India Pale Ale (IPA)"><option value="Double IPA"><option value="New England IPA">
                  <option value="Amber / Red Ale"><option value="Brown Ale"><option value="Porter"><option value="Stout"><option value="Imperial Stout">
                  <option value="Saison / Farmhouse Ale"><option value="Belgian Blonde"><option value="Dubbel"><option value="Tripel"><option value="Quadrupel">
                  <option value="Sour Ale"><option value="Berliner Weisse"><option value="Gose"><option value="Lambic / Gueuze"><option value="Fruchtbier"><option value="Rauchbier"><option value="Schwarzbier"><option value="Alkoholfrei">
                </datalist>
              </p>
              <p style="margin-top: 6px;">
                <strong>Land:</strong><br>
                <select id="editCountry" class="detail-edit-field detail-edit-input">
                  <option value="">Land wählen …</option>
                  <option value="Deutschland">Deutschland</option>
                  <option value="Kolumbien">Kolumbien</option>
                  <option value="Schottland">Schottland</option>
                  <option value="England">England</option>
                  <option value="Irland">Irland</option>
                  <option value="Nordirland">Nordirland</option>
                  <option value="Frankreich">Frankreich</option>
                  <option value="Niederlande">Niederlande</option>
                  <option value="Belgien">Belgien</option>
                  <option value="Spanien">Spanien</option>
                  <option value="Österreich">Österreich</option>
                  <option value="Tschechien">Tschechien</option>
                  <option value="Dänemark">Dänemark</option>
                  <option value="Schweden">Schweden</option>
                  <option value="Norwegen">Norwegen</option>
                  <option value="Polen">Polen</option>
                  <option value="Italien">Italien</option>
                  <option value="USA">USA</option>
                  <option value="Japan">Japan</option>
                  <option value="Australien">Australien</option>
                  <option value="Neuseeland">Neuseeland</option>
                  <option value="Kanada">Kanada</option>
                  <option value="Indien">Indien</option>
                  <option value="Schweiz">Schweiz</option>
                  <option value="Taiwan">Taiwan</option>
                  <option value="Finnland">Finnland</option>
                </select>
              </p>
              <div style="margin-top: 6px;">
                <strong>Region:</strong><br>
                <input type="text" id="editRegion" list="beerRegionOptions" class="detail-edit-field detail-edit-input" placeholder="Region eingeben oder auswählen …">
                <datalist id="beerRegionOptions">
                  <option value="">Region wählen …</option>
                  <option value="Highlands">Highlands</option>
                  <option value="Speyside">Speyside</option>
                  <option value="Lowlands">Lowlands</option>
                  <option value="Islay">Islay</option>
                  <option value="Islands">Islands</option>
                  <option value="Campbeltown">Campbeltown</option>
                  <option value="Cumbria / Lake District">Cumbria / Lake District</option>
                  <option value="Leinster">Leinster</option>
                  <option value="Cork/ Munster">Cork/ Munster</option>
                  <option value="County Kerry">County Kerry</option>
                  <option value="County Wicklow / Wicklow Mountains">County Wicklow / Wicklow Mountains</option>
                  <option value="Antrim">Antrim</option>
                  <option value="County Down">County Down</option>
                  <option value="Cognac">Cognac</option>
                  <option value="Kentucky">Kentucky</option>
                  <option value="Indiana">Indiana</option>
                  <option value="Pennsylvania">Pennsylvania</option>
                  <option value="Washington">Washington</option>
                  <option value="Manitoba">Manitoba</option>
                  <option value="Luzern">Luzern</option>
                  <option value="Isokyrö / Südösterbotten">Isokyrö / Südösterbotten</option>
                  <option value="Victoria/ Melbourne">Victoria/ Melbourne</option>
                  <option value="Marlborough">Marlborough</option>
                  <option value="Baden-Württemberg">Baden-Württemberg</option>
                  <option value="Bayern">Bayern</option>
                  <option value="Berlin">Berlin</option>
                  <option value="Brandenburg">Brandenburg</option>
                  <option value="Bremen">Bremen</option>
                  <option value="Hamburg">Hamburg</option>
                  <option value="Hessen">Hessen</option>
                  <option value="Mecklenburg-Vorpommern">Mecklenburg-Vorpommern</option>
                  <option value="Niedersachsen">Niedersachsen</option>
                  <option value="Nordrhein-Westfalen">Nordrhein-Westfalen</option>
                  <option value="Rheinland-Pfalz">Rheinland-Pfalz</option>
                  <option value="Saarland">Saarland</option>
                  <option value="Sachsen">Sachsen</option>
                  <option value="Sachsen-Anhalt">Sachsen-Anhalt</option>
                  <option value="Schleswig-Holstein">Schleswig-Holstein</option>
                  <option value="Thüringen">Thüringen</option>
                </datalist>
                <div id="editFlagPreview" style="display:flex; gap:10px; align-items:center; margin-top:6px; min-height:22px;">
                  <img id="editCountryFlagPreview" alt="Landesflagge Vorschau" style="display:none; height:16px; width:auto; border:1px solid rgba(0,0,0,0.12); border-radius:2px;">
                  <img id="editRegionFlagPreview" alt="Regionsflagge Vorschau" style="display:none; height:16px; width:auto; border:1px solid rgba(0,0,0,0.12); border-radius:2px;">
                </div>
                <input type="hidden" id="editFlagUrl">
                <input type="hidden" id="editRegionFlagUrl">
              </div>
              <p style="margin-top: 6px;">
                <strong>Volumen (ml):</strong><br>
                <input type="number" id="editVolumeMl" class="detail-edit-field detail-edit-input" min="1" step="1" inputmode="numeric">
              </p>
              <p style="margin-top: 6px;">
                <strong>ABV (% vol.):</strong><br>
                <input type="number" id="editAbv" class="detail-edit-field detail-edit-input" min="0" step="0.01" inputmode="decimal">
              </p>
              <p style="margin-top: 6px;">
                <strong>Gärungsart:</strong><br>
                <select id="editFermentationType" class="detail-edit-field detail-edit-input">
                  <option value="">Gärungsart wählen …</option>
                  <option value="Obergärig">Obergärig</option>
                  <option value="Untergärig">Untergärig</option>
                  <option value="Spontanvergoren">Spontanvergoren</option>
                  <option value="Gemischt">Gemischt</option>
                </select>
              </p>
              <p style="margin-top: 6px;">
                <strong>Gebinde:</strong><br>
                <select id="editPackageType" class="detail-edit-field detail-edit-input">
                  <option value="">Gebinde wählen …</option>
                  <option value="Flasche">Flasche</option>
                  <option value="Dose">Dose</option>
                  <option value="Fass">Fass</option>
                  <option value="Sonstiges">Sonstiges</option>
                </select>
              </p>
              <p style="margin-top: 6px;">
                <strong>Preis (€):</strong><br>
                <input type="number" id="editPriceEur" class="detail-edit-field detail-edit-input" min="0" step="0.01" inputmode="decimal">
              </p>
              <p style="margin-top: 6px;">
                <strong>Edition/Jahrgang/Batch:</strong><br>
                <input type="text" id="editEditionBatch" class="detail-edit-field detail-edit-input">
              </p>
              <hr class="block-divider">
              <p>
                <label>
                  <input type="checkbox" id="editIsCollector">
                  Sammlerstück / Sonderedition
                </label>
              </p>
              <p>
                <label>
                  <input type="checkbox" id="editIsIncomplete">
                  Unvollständiger Eintrag
                </label>
              </p>
            </div>
          </div>
        </div>
      </div>

      <div id="masterDataEditHint" class="detail-edit-hint">* Pflichtfeld</div>
      <div class="detail-section-actions">
        <button type="button" id="btnCancelMasterDataEdit" class="detail-edit-btn detail-edit-btn-secondary">Abbrechen</button>
        <button type="button" id="btnSaveMasterData" class="detail-edit-btn">Speichern</button>
      </div>
    </div>
  </div>

  <script src="gdb_beer_images.js?v=20260922-3"></script>
  <script src="gdb_beer_create.js?v=20261005-co1"></script>
</body>
</html>
